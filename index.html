<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owen Smith — Work</title>
<meta name="description" content="A portfolio of a few of my favorite physical and digital builds by Owen Smith.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6; --bg-card: #fbf8f2; --ink: #1f1a14; --ink-soft: #5a4f42;
    --rule: #d9cfbf; --accent: #8a3a1f; --mat: 10px; --frame-aspect: 3 / 4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Edit bar ---------- */
  .edit-bar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.6rem 2rem; background: var(--ink); color: var(--bg); font-size: 0.85rem;
  }
  .edit-bar button {
    font: inherit; font-size: 0.8rem; background: var(--bg-card); color: var(--ink);
    border: none; padding: 0.32rem 0.7rem; border-radius: 5px; cursor: pointer; margin-left: 0.4rem;
  }
  .edit-bar button:hover { background: #fff; }
  #publish-btn { background: var(--accent); color: #fff; }
  #publish-btn:hover { background: #a0461f; }

  /* ---------- Header ---------- */
  header { padding: 4rem 2rem 2.5rem; max-width: 1200px; margin: 0 auto; }
  .site-title {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(2.5rem, 6vw, 4.5rem);
    letter-spacing: -0.02em; line-height: 1; font-variation-settings: "opsz" 144;
  }
  .site-title em { font-style: italic; font-weight: 400; color: var(--accent); }
  .site-sub { margin-top: 1.25rem; font-size: 1rem; color: var(--ink-soft); max-width: 40ch; }

  /* ---------- Sections + nav ---------- */
  main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 6rem; }
  .section { scroll-margin-top: 1.25rem; }
  #digital { margin-top: 4.5rem; padding-top: 3rem; border-top: 1px solid var(--rule); }
  .toggle { display: flex; align-items: center; gap: 1.1rem; margin-bottom: 2.25rem; }
  .toggle a {
    font-family: 'Fraunces', serif; font-size: clamp(1.6rem, 3.5vw, 2.4rem); font-weight: 400;
    letter-spacing: -0.02em; line-height: 1; text-decoration: none; color: var(--ink-soft);
    opacity: 0.4; transition: opacity 0.25s ease, color 0.25s ease;
  }
  .toggle a:hover { opacity: 0.8; }
  .toggle a.active { color: var(--ink); opacity: 1; font-weight: 600; }
  .toggle .divider { width: 1px; align-self: stretch; min-height: 1.7rem; background: var(--rule); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 3rem 2rem; }

  /* ---------- Card ---------- */
  .card { display: flex; flex-direction: column; position: relative; }
  .frame {
    position: relative; width: 100%; aspect-ratio: var(--frame-aspect);
    background: var(--card-accent, var(--bg-card)); border: 1px solid var(--rule); overflow: hidden;
  }
  .frame img, .frame video {
    position: absolute; inset: var(--mat);
    width: calc(100% - 2 * var(--mat)); height: calc(100% - 2 * var(--mat));
    object-fit: contain; object-position: center; background: var(--card-accent, var(--bg-card));
    opacity: 0; transition: opacity 0.35s ease; -webkit-user-drag: none; user-select: none;
  }
  .frame img.active, .frame video.active { opacity: 1; }

  .nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px;
    border: none; background: rgba(251, 248, 242, 0.85); backdrop-filter: blur(4px);
    color: var(--ink); font-family: 'Fraunces', serif; font-size: 1.25rem; cursor: pointer;
    opacity: 0; transition: opacity 0.2s ease, background 0.2s ease; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .frame:hover .nav { opacity: 1; }
  .nav:hover { background: var(--bg-card); }
  .nav.prev { left: 0.75rem; } .nav.next { right: 0.75rem; }
  @media (hover: none) { .nav { opacity: 0.9; } }

  .dots { position: absolute; bottom: 0.75rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.4rem; z-index: 2; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(251, 248, 242, 0.55); border: 1px solid rgba(31, 26, 20, 0.25); transition: background 0.2s ease; }
  .dot.active { background: var(--bg-card); border-color: var(--bg-card); }

  .meta { margin-top: 1rem; display: flex; align-items: baseline; gap: 0.75rem; }
  .index-num { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 0.85rem; color: var(--card-accent, var(--ink-soft)); min-width: 1.5rem; }
  .title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.25rem; letter-spacing: -0.01em; line-height: 1.2; }

  /* ---------- Description + read more ---------- */
  .desc-wrap { margin-top: 0.5rem; margin-left: 2.25rem; }
  .readmore {
    background: none; border: none; padding: 0; font: inherit; font-size: 0.82rem;
    color: var(--card-accent, var(--accent)); cursor: pointer; border-bottom: 1px solid transparent;
  }
  .readmore:hover { border-bottom-color: currentColor; }
  .desc-panel { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .desc-panel .desc { margin-top: 0.55rem; font-size: 0.9rem; color: var(--ink-soft); line-height: 1.5; }

  /* ---------- Digital placeholders ---------- */
  .placeholder-card .ph-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-style: italic; font-size: 1.05rem; color: rgba(251, 248, 242, 0.78);
  }
  .placeholder-card .title { color: var(--ink-soft); font-weight: 400; }

  /* ---------- Authoring ---------- */
  .editbtn {
    margin-left: auto; background: none; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--ink-soft); cursor: pointer; font: inherit; font-size: 0.72rem; padding: 0.1rem 0.45rem;
  }
  .editbtn:hover { color: var(--accent); border-color: var(--accent); }
  body:not(.edit-mode) .editbtn, body:not(.api-on) .editbtn { display: none; }
  .editor { margin-top: 0.7rem; display: flex; flex-direction: column; gap: 0.45rem; background: var(--bg-card); border: 1px solid var(--rule); border-radius: 7px; padding: 0.7rem; }
  .editor input, .editor textarea, .editor select { font: inherit; font-size: 0.85rem; padding: 0.32rem 0.45rem; border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink); width: 100%; }
  .editor textarea { min-height: 3.4rem; resize: vertical; }
  .editor .ed-row { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .editor .ed-row label { font-size: 0.78rem; color: var(--ink-soft); }
  .editor button { cursor: pointer; border: 1px solid var(--rule); border-radius: 4px; background: var(--ink); color: var(--bg); padding: 0.28rem 0.65rem; font: inherit; font-size: 0.8rem; }
  .editor .ed-cancel, .editor .ed-hide { background: var(--bg-card); color: var(--ink-soft); }
  .editor .ed-hide { margin-left: auto; }

  body.edit-mode .card[draggable] { cursor: grab; }
  body.edit-mode .card[draggable]:active { cursor: grabbing; }
  body.edit-mode .frame { outline: 2px dashed var(--card-accent, var(--ink)); outline-offset: 4px; }
  body.edit-mode .nav, body.edit-mode .dots { display: none; }
  .card.dragging { opacity: 0.35; }
  .card.drop-before .frame { box-shadow: -8px 0 0 var(--ink); }
  .card.drop-after .frame { box-shadow: 8px 0 0 var(--ink); }
  .card.is-new .frame { outline: 2px solid var(--accent); }
  .newbadge { position: absolute; top: 8px; left: 8px; z-index: 3; background: var(--accent); color: #fff; font-size: 0.68rem; padding: 0.1rem 0.4rem; border-radius: 3px; letter-spacing: 0.02em; }
  body:not(.edit-mode) .newbadge { display: none; }

  body.dragging-files::after {
    content: 'Drop images to add'; position: fixed; inset: 0; z-index: 100;
    background: rgba(31, 26, 20, 0.62); color: var(--bg); display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-style: italic; font-size: clamp(1.5rem, 4vw, 2.5rem);
  }

  /* ---------- Footer ---------- */
  footer { max-width: 1200px; margin: 0 auto; padding: 2rem; border-top: 1px solid var(--rule); font-size: 0.85rem; color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
  .footer-right { display: inline-flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  footer a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--rule); transition: color 0.2s ease, border-color 0.2s ease; }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
  .textlink { background: none; border: none; padding: 0; font: inherit; color: var(--ink-soft); cursor: pointer; border-bottom: 1px solid var(--rule); transition: color 0.2s ease, border-color 0.2s ease; }
  .textlink:hover { color: var(--accent); border-color: var(--accent); }
  .login-form { display: inline-flex; align-items: center; gap: 0.4rem; }
  .login-form input { font: inherit; font-size: 0.85rem; padding: 0.25rem 0.5rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg-card); color: var(--ink); width: 9.5rem; }
  .login-form button { font: inherit; padding: 0.25rem 0.6rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--ink); color: var(--bg); cursor: pointer; }
  .login-error { color: var(--accent); font-size: 0.8rem; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  @media (max-width: 600px) {
    header { padding: 2.5rem 1.25rem 2rem; }
    main { padding: 1.25rem 1.25rem 4rem; }
    .grid { gap: 2.5rem 1.25rem; }
    .edit-bar { padding: 0.6rem 1.25rem; flex-wrap: wrap; }
    :root { --mat: 8px; }
  }
</style>
</head>
<body>

<div id="edit-bar" class="edit-bar" hidden>
  <span class="edit-bar__msg"></span>
  <span class="edit-bar__actions">
    <button id="publish-btn" type="button" hidden>Publish to GitHub</button>
    <button id="copy-order" type="button">Copy order</button>
    <button id="reset-order" type="button">Reset</button>
    <button id="logout-btn" type="button">Done</button>
  </span>
</div>

<header>
  <h1 class="site-title">Owen Smith<em>.</em></h1>
  <p class="site-sub">A portfolio of a few of my favorite builds.</p>
</header>

<main>
  <section id="physical" class="section">
    <nav class="toggle" aria-label="Sections">
      <a href="#physical" class="active" aria-current="true">Physical</a>
      <span class="divider" aria-hidden="true"></span>
      <a href="#digital">Digital</a>
    </nav>
    <div class="grid" id="grid"></div>
  </section>

  <section id="digital" class="section">
    <nav class="toggle" aria-label="Sections">
      <a href="#physical">Physical</a>
      <span class="divider" aria-hidden="true"></span>
      <a href="#digital" class="active" aria-current="true">Digital</a>
    </nav>
    <div class="grid" id="digital-grid"></div>
  </section>
</main>

<footer>
  <span>© <span id="year"></span> Owen Smith</span>
  <span class="footer-right">
    <a href="mailto:owenesmith@gmail.com">owenesmith@gmail.com</a>
    <button id="login-btn" class="textlink" type="button">login</button>
    <span id="login-form" class="login-form" hidden>
      <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <button id="login-submit" type="button">→</button>
    </span>
    <span id="login-error" class="login-error" hidden></span>
  </span>
</footer>

<script>
  // ====== Config ======
  const palette = ["#8a3a1f", "#a8551f", "#6b4423", "#4a4a52", "#7d5a3c", "#2b2018", "#9c5b2a", "#5e5e68"];
  const isVideo = (src) => /\.(mp4|webm|ogg|m4v)$/i.test(src);
  const CYCLE_MS = 5000, STAGGER_MS = 220, SKIP_CYCLES = 2;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PASS_HASH = "d65ee151f642081b0f161569f1981ec6309bbee92525ee85796a8f8a44fbd230";
  const ORDER_KEY = "portfolio.order.v1";
  const DIGITAL_PLACEHOLDERS = ["#4a4a52", "#6b4423", "#5e5e68"];
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ====== State ======
  let API_OK = false;
  let MANIFEST = { physical: [], digital: [] };
  let CONTENT = { items: {}, order: { physical: [], digital: [] } };
  let editMode = false, carousels = [], conductorTimer = null;

  const gridP = document.getElementById('grid');
  const gridD = document.getElementById('digital-grid');

  // ====== Load data (studio API if present, else static manifest) ======
  async function loadData() {
    API_OK = false;
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      if (r.ok) { const j = await r.json(); API_OK = true; CONTENT = j.content || CONTENT; MANIFEST = j.manifest; }
    } catch (e) { /* no studio */ }
    if (!API_OK) {
      MANIFEST = await (await fetch('manifest.json', { cache: 'no-store' })).json();
      applyLocalOrder();
    }
    document.body.classList.toggle('api-on', API_OK);
  }
  function applyLocalOrder() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null'); } catch (e) {}
    if (!Array.isArray(saved)) return;
    const rank = id => { const i = saved.indexOf(id); return i < 0 ? 1e9 : i; };
    MANIFEST.physical = MANIFEST.physical.slice().sort((a, b) => rank(a.id) - rank(b.id));
  }
  const knownIds = () => new Set([...(CONTENT.order?.physical || []), ...(CONTENT.order?.digital || [])]);

  // ====== Conductor (cascading auto-rotation) ======
  function runWave() {
    carousels.forEach((c, i) => setTimeout(() => {
      if (c.paused || document.hidden) return;
      if (c.skip > 0) { c.skip--; return; }
      c.advance();
    }, i * STAGGER_MS));
  }
  function startConductor() { stopConductor(); if (editMode || reduceMotion || !carousels.length) return; conductorTimer = setInterval(runWave, CYCLE_MS); }
  function stopConductor() { if (conductorTimer) { clearInterval(conductorTimer); conductorTimer = null; } }
  document.addEventListener('visibilitychange', () => { document.hidden ? stopConductor() : startConductor(); });

  // ====== Build a card ======
  function buildCard(p, i, section, isNew) {
    const card = document.createElement('article');
    card.className = 'card' + (isNew ? ' is-new' : '');
    card.dataset.title = p.title; card.dataset.id = p.id; card.dataset.section = section;
    card.style.setProperty('--card-accent', p.color || palette[i % palette.length]);

    const multi = p.photos.length > 1;
    const media = p.photos.map((src, idx) => {
      const a = idx === 0 ? ' active' : '';
      return isVideo(src)
        ? `<video class="media${a}" src="${esc(src)}" muted loop playsinline preload="metadata" draggable="false" aria-label="${esc(p.title)} — clip ${idx + 1}"></video>`
        : `<img class="media${a}" src="${esc(src)}" alt="${esc(p.title)} — photo ${idx + 1}" loading="lazy" draggable="false">`;
    }).join('');
    const dots = multi ? `<div class="dots">${p.photos.map((_, idx) => `<span class="dot ${idx === 0 ? 'active' : ''}"></span>`).join('')}</div>` : '';
    const arrows = multi ? `<button class="nav prev" aria-label="Previous">‹</button><button class="nav next" aria-label="Next">›</button>` : '';
    const descBlock = p.desc ? `
      <div class="desc-wrap">
        <button class="readmore" type="button" aria-expanded="false">Read more</button>
        <div class="desc-panel"><p class="desc">${esc(p.desc)}</p></div>
      </div>` : '';

    card.innerHTML = `
      <div class="frame">
        ${isNew ? '<span class="newbadge">New</span>' : ''}
        ${media} ${arrows} ${dots}
      </div>
      <div class="meta">
        <span class="index-num">${String(i + 1).padStart(2, '0')}</span>
        <h2 class="title">${esc(p.title)}</h2>
        <button class="editbtn" type="button">✎ Edit</button>
      </div>
      ${descBlock}`;

    // Carousel
    const frame = card.querySelector('.frame');
    const items = frame.querySelectorAll('.media');
    const dotEls = frame.querySelectorAll('.dot');
    let pos = 0;
    const syncVideo = () => items.forEach((el, idx) => { if (el.tagName === 'VIDEO') { idx === pos ? el.play().catch(() => {}) : (el.pause(), el.currentTime = 0); } });
    syncVideo();
    if (multi) {
      const show = (n) => {
        items[pos].classList.remove('active'); dotEls[pos].classList.remove('active');
        pos = (n + items.length) % items.length;
        items[pos].classList.add('active'); dotEls[pos].classList.add('active'); syncVideo();
      };
      const ctrl = { paused: false, skip: 0, advance: () => show(pos + 1) };
      carousels.push(ctrl);
      card.addEventListener('mouseenter', () => { ctrl.paused = true; });
      card.addEventListener('mouseleave', () => { ctrl.paused = false; });
      frame.querySelector('.prev').addEventListener('click', () => { show(pos - 1); ctrl.skip = SKIP_CYCLES; });
      frame.querySelector('.next').addEventListener('click', () => { show(pos + 1); ctrl.skip = SKIP_CYCLES; });
    }

    // Read more
    if (p.desc) {
      const btn = card.querySelector('.readmore');
      const panel = card.querySelector('.desc-panel');
      btn.addEventListener('click', () => {
        const open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!open));
        panel.style.maxHeight = open ? '0px' : panel.scrollHeight + 'px';
        btn.textContent = open ? 'Read more' : 'Close';
      });
    }

    // Editor (only meaningful with the studio API)
    card.querySelector('.editbtn').addEventListener('click', () => openEditor(card, p, section));
    if (editMode) makeDraggable(card);
    return card;
  }

  function placeholderCard(color, i) {
    return `<article class="card placeholder-card" style="--card-accent:${color}">
      <div class="frame"><span class="ph-label">Coming soon</span></div>
      <div class="meta"><span class="index-num">${String(i + 1).padStart(2, '0')}</span><h2 class="title">Digital project</h2></div>
    </article>`;
  }

  // ====== Render ======
  function render() {
    carousels = [];
    const known = knownIds();
    gridP.innerHTML = '';
    MANIFEST.physical.forEach((p, i) => gridP.appendChild(buildCard(p, i, 'physical', editMode && API_OK && !known.has(p.id))));
    if (MANIFEST.digital && MANIFEST.digital.length) {
      gridD.innerHTML = '';
      MANIFEST.digital.forEach((p, i) => gridD.appendChild(buildCard(p, i, 'digital', editMode && API_OK && !known.has(p.id))));
    } else {
      gridD.innerHTML = DIGITAL_PLACEHOLDERS.map((c, i) => placeholderCard(c, i)).join('');
    }
    startConductor();
  }

  // ====== Inline editor ======
  let openEditorEl = null;
  function openEditor(card, p, section) {
    if (!API_OK) { alert('Editing runs through the local studio.\nRun:  node studio.mjs\nthen open this page from there.'); return; }
    if (openEditorEl) openEditorEl.remove();
    const ed = document.createElement('div');
    ed.className = 'editor';
    ed.innerHTML = `
      <input class="ed-title" value="${esc(p.title)}" placeholder="Title">
      <textarea class="ed-desc" placeholder="Description (optional)">${esc(p.desc)}</textarea>
      <div class="ed-row">
        <label>Section</label>
        <select class="ed-section">
          <option value="physical"${section === 'physical' ? ' selected' : ''}>Physical</option>
          <option value="digital"${section === 'digital' ? ' selected' : ''}>Digital</option>
        </select>
        <button class="ed-save" type="button">Save</button>
        <button class="ed-cancel" type="button">Cancel</button>
        <button class="ed-hide" type="button">Hide</button>
      </div>`;
    card.appendChild(ed); openEditorEl = ed;
    ed.querySelector('.ed-cancel').addEventListener('click', () => { ed.remove(); openEditorEl = null; });
    ed.querySelector('.ed-save').addEventListener('click', async () => {
      CONTENT.items = CONTENT.items || {};
      CONTENT.items[p.id] = {
        title: ed.querySelector('.ed-title').value.trim() || undefined,
        desc: ed.querySelector('.ed-desc').value.trim() || undefined,
        section: ed.querySelector('.ed-section').value,
        color: (CONTENT.items[p.id] || {}).color || undefined,
      };
      ensureOrder(p.id, ed.querySelector('.ed-section').value);
      await saveContent('Saved.');
    });
    ed.querySelector('.ed-hide').addEventListener('click', async () => {
      if (!confirm('Hide "' + p.title + '" from the site?')) return;
      CONTENT.items = CONTENT.items || {};
      CONTENT.items[p.id] = { ...(CONTENT.items[p.id] || {}), hidden: true };
      await saveContent('Hidden.');
    });
  }
  function ensureOrder(id, section) {
    CONTENT.order = CONTENT.order || { physical: [], digital: [] };
    for (const s of ['physical', 'digital']) CONTENT.order[s] = (CONTENT.order[s] || []).filter(x => x !== id);
    CONTENT.order[section] = CONTENT.order[section] || [];
    if (!CONTENT.order[section].includes(id)) CONTENT.order[section].push(id);
  }
  async function saveContent(msg) {
    try {
      const r = await fetch('/api/content', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(CONTENT) });
      if (!r.ok) throw new Error(await r.text());
      openEditorEl = null;
      await loadData(); render(); flashMsg(msg || 'Saved.');
    } catch (e) { flashMsg('Save failed: ' + e.message); }
  }

  // ====== Drag to reorder (within a section) ======
  let dragId = null;
  function makeDraggable(card) {
    card.setAttribute('draggable', 'true');
    card.addEventListener('dragstart', (e) => { dragId = card.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); card.classList.add('dragging'); });
    card.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.card').forEach(c => c.classList.remove('dragging', 'drop-before', 'drop-after')); });
    card.addEventListener('dragover', (e) => {
      if (!dragId || card.dataset.id === dragId || card.dataset.section !== draggedSection()) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      const list = MANIFEST[card.dataset.section];
      const from = list.findIndex(p => p.id === dragId), to = list.findIndex(p => p.id === card.dataset.id);
      card.classList.toggle('drop-after', from < to); card.classList.toggle('drop-before', from > to);
    });
    card.addEventListener('dragleave', () => card.classList.remove('drop-before', 'drop-after'));
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      const section = card.dataset.section;
      if (!dragId || card.dataset.id === dragId || section !== draggedSection()) return;
      const list = MANIFEST[section];
      const from = list.findIndex(p => p.id === dragId), to = list.findIndex(p => p.id === card.dataset.id);
      const [moved] = list.splice(from, 1);
      const insertAt = list.findIndex(p => p.id === card.dataset.id);
      list.splice(from < to ? insertAt + 1 : insertAt, 0, moved);
      persistOrder(section);
      render();
    });
  }
  function draggedSection() {
    for (const s of ['physical', 'digital']) if (MANIFEST[s].some(p => p.id === dragId)) return s;
    return 'physical';
  }
  async function persistOrder(section) {
    if (API_OK) {
      CONTENT.order = CONTENT.order || {};
      CONTENT.order[section] = MANIFEST[section].map(p => p.id);
      try { await fetch('/api/content', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(CONTENT) }); } catch (e) {}
    } else {
      localStorage.setItem(ORDER_KEY, JSON.stringify(MANIFEST.physical.map(p => p.id)));
    }
  }

  // ====== Add images: drop anywhere (uploads to studio) ======
  let dragDepth = 0;
  window.addEventListener('dragover', (e) => { if (editMode && API_OK && [...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
  window.addEventListener('dragenter', (e) => { if (editMode && API_OK && [...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; document.body.classList.add('dragging-files'); } });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging-files'); } });
  window.addEventListener('drop', async (e) => {
    if (!editMode || !API_OK) return;
    const files = [...(e.dataTransfer?.files || [])];
    if (!files.length) return;
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging-files');
    await uploadFiles(files);
  });
  async function uploadFiles(fileList) {
    const files = [...fileList].filter(f => /\.(jpe?g|png|webp|mov|mp4|m4v)$/i.test(f.name));
    if (!files.length) { flashMsg('No image files in that drop.'); return; }
    flashMsg('Adding ' + files.length + ' file(s)…');
    for (const f of files) {
      try {
        const buf = await f.arrayBuffer();
        await fetch('/api/upload/' + encodeURIComponent(f.name), { method: 'PUT', body: buf });
      } catch (e) { flashMsg('Upload failed: ' + e.message); }
    }
    await loadData(); render();
    flashMsg(files.length + ' file(s) added — click ✎ Edit on the new card(s) to name & describe them.');
  }

  // ====== Login / edit mode ======
  const loginBtn = document.getElementById('login-btn'), loginForm = document.getElementById('login-form');
  const loginPass = document.getElementById('login-pass'), loginError = document.getElementById('login-error');
  const editBar = document.getElementById('edit-bar'), editMsg = editBar.querySelector('.edit-bar__msg');
  loginBtn.addEventListener('click', () => { loginForm.hidden = !loginForm.hidden; loginError.hidden = true; if (!loginForm.hidden) loginPass.focus(); });
  loginPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
  document.getElementById('login-submit').addEventListener('click', tryLogin);
  async function sha256hex(str) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  async function tryLogin() {
    loginError.hidden = true;
    let hash; try { hash = await sha256hex(loginPass.value); } catch (e) { loginError.textContent = 'Login needs https or localhost'; loginError.hidden = false; return; }
    if (hash === PASS_HASH) { loginPass.value = ''; loginForm.hidden = true; enterEditMode(); }
    else { loginError.textContent = 'Incorrect password'; loginError.hidden = false; }
  }
  function enterEditMode() {
    editMode = true; document.body.classList.add('edit-mode'); editBar.hidden = false; loginBtn.hidden = true;
    document.getElementById('publish-btn').hidden = !API_OK;
    document.getElementById('copy-order').hidden = API_OK;
    document.getElementById('reset-order').hidden = API_OK;
    editMsg.textContent = API_OK
      ? 'Editing — drag to reorder · ✎ to edit text · drop images anywhere to add.'
      : 'Reorder preview (saved to this browser). Run `node studio.mjs` locally to edit text, add images & publish.';
    render();
  }
  function exitEditMode() { editMode = false; document.body.classList.remove('edit-mode'); editBar.hidden = true; loginBtn.hidden = false; if (openEditorEl) { openEditorEl.remove(); openEditorEl = null; } render(); }
  document.getElementById('logout-btn').addEventListener('click', exitEditMode);
  document.getElementById('reset-order').addEventListener('click', () => { localStorage.removeItem(ORDER_KEY); loadData().then(render); flashMsg('Reset to default order.'); });
  document.getElementById('copy-order').addEventListener('click', async () => {
    const text = MANIFEST.physical.map((p, i) => `${i + 1}. ${p.title}`).join('\n');
    try { await navigator.clipboard.writeText(text); flashMsg('Order copied.'); } catch (e) { window.prompt('Order:', MANIFEST.physical.map(p => p.title).join(' | ')); }
  });
  document.getElementById('publish-btn').addEventListener('click', async () => {
    flashMsg('Publishing to GitHub…');
    try {
      const r = await fetch('/api/publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Update portfolio content' }) });
      const j = await r.json();
      flashMsg(j.ok ? ('Published ✓ ' + (j.detail || '')) : ('Publish failed: ' + (j.error || 'unknown')));
    } catch (e) { flashMsg('Publish failed: ' + e.message); }
  });
  let flashTimer;
  function flashMsg(msg) {
    const base = editMsg.dataset.base || (editMsg.dataset.base = '');
    editMsg.textContent = msg; clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      editMsg.textContent = API_OK
        ? 'Editing — drag to reorder · ✎ to edit text · drop images anywhere to add.'
        : 'Reorder preview (saved to this browser). Run `node studio.mjs` locally to edit, add & publish.';
    }, 3500);
  }

  // ====== Init ======
  (async () => {
    await loadData();
    render();
    document.getElementById('year').textContent = new Date().getFullYear();
  })();
</script>

</body>
